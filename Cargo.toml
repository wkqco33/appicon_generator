[package]
name = "appicon_generator"
version = "0.1.0"
edition = "2024"
description = "Generate Android and iOS app icons from one source image"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wkqco33/appicon_generator"
homepage = "https://github.com/wkqco33/appicon_generator"
keywords = ["icon", "android", "ios", "image", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "appicon_generator"
path = "src/main.rs"

[lib]
name = "appicon_generator"
path = "src/lib.rs"

[dependencies]
image = "0.25.8"
wrcli = "0.1.0"

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.1"
predicates = "3.0"
