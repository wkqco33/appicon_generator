name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux_amd64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin_arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows_amd64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/appicon_generator dist/
          tar -C dist -czf appicon_generator_${{ matrix.suffix }}.tar.gz appicon_generator
          sha256sum appicon_generator_${{ matrix.suffix }}.tar.gz > appicon_generator_${{ matrix.suffix }}.tar.gz.sha256
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/${{ matrix.target }}/release/appicon_generator.exe dist/
          Compress-Archive -Path dist/appicon_generator.exe -DestinationPath appicon_generator_${{ matrix.suffix }}.zip
          (Get-FileHash appicon_generator_${{ matrix.suffix }}.zip -Algorithm SHA256).Hash.ToLower() + "  appicon_generator_${{ matrix.suffix }}.zip" | Out-File -Encoding ascii appicon_generator_${{ matrix.suffix }}.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            appicon_generator_${{ matrix.suffix }}.${{ matrix.archive }}
            appicon_generator_${{ matrix.suffix }}.${{ matrix.archive }}.sha256
